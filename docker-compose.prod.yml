services:
  app:
    image: ghcr.io/shba007/portfolio-shirsendu:latest@sha256:e97087b12d348b35b156c52f3c589289ab23d4ee8923fec945d6fd354c4dbb9a
    env_file:
      - .env
    volumes:
      - portfolio-shirsendu_static:/app/static
      - portfolio-shirsendu_data:/app/.data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  portfolio-shirsendu_static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/portfolio-shirsendu/static
  portfolio-shirsendu_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/portfolio-shirsendu/.data

networks:
  internal:
    driver: overlay
